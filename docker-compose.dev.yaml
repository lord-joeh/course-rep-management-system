services:
  api:
    container_name: course-rep-api
    build:
      context: .
      target: dev-deps
    command: ["pnpm", "dev"]
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
    ports:
      - 3000:${PORT}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - web
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs

  worker:
    container_name: course-rep-worker
    build:
      context: .
      target: dev-deps
    command: ["pnpm", "dev:worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - web
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    env_file:
      - .env
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      web:
        aliases: [redis]
    volumes:
      - redis_data:/data

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
       web:
        aliases: [postgres]
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  web:
    external: true

volumes:
  redis_data:
  postgres_data:
