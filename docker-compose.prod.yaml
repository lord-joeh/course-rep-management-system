services:
  postgres:
    image: postgres:16-alpine
    container_name: rep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-course_rep_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_course_rep_pass_2026}
      POSTGRES_DB: ${DB_NAME:-course_rep_db}
    # ports:
    #   - '${DB_PORT:-5432}:5432'
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-rep-network

  redis:
    image: redis:7-alpine
    container_name: rep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_pass_2026}
    expose:
      - 6379
    # ports:
    #   - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-secure_redis_pass_2026}', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-rep-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rep-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx typeorm migration:run -d dist/database/data-source.js && node dist/main.js"
    # ports:
    #   - '${PORT:-5000}:5000'
    expose:
      - 5000
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secure_redis_pass_2026}
    networks:
      - course-rep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  course-rep-network:
    driver: bridge
