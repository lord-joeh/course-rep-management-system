services:
  postgres:
    image: postgres:16-alpine
    container_name: rep-postgres
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lord}
      POSTGRES_DB: ${DB_NAME:-course-rep-management-system}
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-rep-network

  redis:
    image: redis:7-alpine
    container_name: rep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_pass_2026}
    expose:
      - 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-secure_redis_pass_2026}', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-rep-network

  backend:
    image: ghcr.io/lord-joeh/course-rep-management-system:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rep-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx typeorm migration:run -d dist/database/data-source.js && node dist/main.js"
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-lord}
      DB_NAME: ${DB_NAME:-course-rep-management-system}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secure_redis_pass_2026}
    networks:
      - course-rep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  course-rep-network:
    driver: bridge
